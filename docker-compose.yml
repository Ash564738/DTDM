version: '3.8'

services:
  # Frontend React SPA
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
        - VITE_USE_MOCK=false
    container_name: ems_frontend
    ports:
      - '3000:80'
    restart: unless-stopped
    environment:
      - PORT=80

